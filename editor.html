<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hendo Academy Editor</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe 
        src="https://hudra.day/type" 
        allow="fullscreen; web-share; storage-access" 
        allowtransparency="true"
        referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
    <script>
        $(document).ready(function() {
            // The iframe takes up the full viewport with no extra space
            // No additional JavaScript needed as CSS handles the layout
        });
    </script>
</body>
</html>
